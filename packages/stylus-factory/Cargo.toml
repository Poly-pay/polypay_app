[package]
name = "polypay-multisig-stylus-factory"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "EIP-1167 factory for the PolyPay Stylus MetaMultiSigWallet, written in Rust/Stylus"

[dependencies]
stylus-sdk = "0.10.7"
alloy-primitives = "1.6"
alloy-sol-types = "1.6"

[dev-dependencies]
stylus-sdk = { version = "0.10.7", features = ["stylus-test"] }

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "polypay-multisig-stylus-factory"
path = "src/main.rs"
required-features = ["export-abi"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"
